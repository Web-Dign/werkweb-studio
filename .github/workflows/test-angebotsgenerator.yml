name: Angebotsgenerator Tests
on:
  pull_request:
    paths:
      - "angebotsgenerator/**"
      - ".github/workflows/test-angebotsgenerator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prüfe fiktive Kalkulationen
        run: node angebotsgenerator/test-pricing.cjs
      - name: Fiktive Formspree-Beispiele validieren (kein Versand)
        run: node angebotsgenerator/formspree-test.cjs --validate
      - name: Nur Vorschau erzeugen (kein Versand)
        run: node angebotsgenerator/formspree-test.cjs shk
